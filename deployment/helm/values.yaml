openadservice:
  name: autonomy-datasets
  image: ghcr.io/thinking-cars/autonomy_datasets:v1.3.0
  env:
    # --- name ------
    NAMESPACE: /
    NAME: autonomy_datasets
    # --- other -----
    LOG_LEVEL: info
    USE_SIM_TIME: true
    DATASET: nvidia_physicalai_av_dataset
    CONFIG: 
    DATASETS_PATH: /datasets
    START_PAUSED: false
    TARGET_FRAME_RATE: 1.0
    PUBLISH_SAMPLES: true
    WRITE_ROSBAG: true
    CONTINUE: false
    OVERWRITE_ROSBAG: false
    WAIT_FOR_ACK: false
    LOOP: false
    RVIZ: yes
    RVIZ_START_DELAY: 2.0
  args:
  - /bin/bash
  - -ic
  - |
    ros2 launch autonomy_datasets autonomy_datasets.launch.py \
      namespace:=${NAMESPACE} \
      name:=${NAME} \
      log_level:=${LOG_LEVEL} \
      use_sim_time:=${USE_SIM_TIME} \
      dataset:=${DATASET} \
      ${CONFIG:+config:=${CONFIG}} \
      datasets_path:=${DATASETS_PATH} \
      start_paused:=${START_PAUSED} \
      target_frame_rate:=${TARGET_FRAME_RATE} \
      publish_samples:=${PUBLISH_SAMPLES} \
      write_rosbag:=${WRITE_ROSBAG} \
      continue:=${CONTINUE} \
      overwrite_rosbag:=${OVERWRITE_ROSBAG} \
      wait_for_ack:=${WAIT_FOR_ACK} \
      loop:=${LOOP} \
      rviz:=${RVIZ} \
      rviz_start_delay:=${RVIZ_START_DELAY}

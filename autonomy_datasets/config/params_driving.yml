/**/*:
  ros__parameters:

    dataset: driving
    dataset_split: dusk  # all, day, dusk, night
    driving_auto_download: true
    driving_download_workers: 8  # concurrent archive downloads (1-32)
    driving_rosbag_duration_seconds: 20.0

    # topics to publish, as patterns of topic names; '*' matches any characters including '/', and a
    # pattern also matches the topics below the namespace it names, e.g. 'camera_*' or 'object_list/lidar_01'
    include_topics: ["*"]
    exclude_topics: []

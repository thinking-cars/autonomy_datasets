/**/*:
  ros__parameters:

    dataset: truckscenes
    dataset_split: mini_val  # train, val, test, mini_train, mini_val, train_detect, train_track
    truckscenes_auto_download: true
    truckscenes_download_workers: 8  # concurrent archive downloads (1-32)

    # topics to publish, as patterns of topic names; '*' matches any characters including '/', and a
    # pattern also matches the topics below the namespace it names, e.g. 'camera_*' or 'object_list/lidar_01'
    include_topics: ["*"]
    exclude_topics: []

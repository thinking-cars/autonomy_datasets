/**/*:
  ros__parameters:

    dataset: waymo_open_dataset
    dataset_split: validation  # all, training, validation
    waymo_min_lidar_points_in_bbox: 1
    waymo_lidar_object_list_filter_cam_front: false

    # topics to publish, as patterns of topic names; '*' matches any characters including '/', and a
    # pattern also matches the topics below the namespace it names, e.g. 'camera_*' or 'object_list/lidar_01'
    include_topics: ["*"]
    exclude_topics: []

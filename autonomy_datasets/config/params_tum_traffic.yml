/**/*:
  ros__parameters:

    dataset: tum_traffic
    # all, or a filter matching the recordings to publish, e.g. a release (r00, r01, r02, ...),
    # a subset (r02_s04) or a split directory of a release (train, val, test)
    dataset_split: r02_s01
    tum_traffic_extract_archives: true  # extract manually downloaded archives found in the dataset directory
    tum_traffic_sync_tolerance_seconds: 0.1  # max. time difference when matching a sensor to a frame
    tum_traffic_rosbag_duration_seconds: 20.0
    tum_traffic_labels_in_base_frame: false  # 3D labels are annotated in the frame of their sensor

    publish_camera_images: true
    publish_lidar_pointclouds: true
    publish_lidar_object_lists: true
